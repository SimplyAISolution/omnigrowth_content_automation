# Model routing configuration (ADR-0002, A1, A2). Model names live ONLY here, never in Python.
# Base URL resolution: env OMNIGROWTH_LOCAL_LLM_URL (for the configured preset) > preset > not built.
# Model names below come from the Phase 0 inventory (docs/audit/probe_output.txt L152-L175);
# edit freely — `GET /api/v1/models` (Phase 4) and the health check report what is reachable.

presets:
  lmstudio:
    base_url_host: "http://127.0.0.1:1234/v1"
    base_url_docker: "http://host.docker.internal:1234/v1"
  ollama:
    base_url_host: "http://127.0.0.1:11434/v1"
    base_url_docker: "http://host.docker.internal:11434/v1"

# Models whose name matches any of these globs are forced REMOTE even behind a local preset
# (PHASE0_AUDIT R3: Ollama exposes `deepseek-v3.1:671b-cloud`).
remote_patterns:
  - "*-cloud"
  - "*:cloud"

providers:
  lmstudio:
    locality: LOCAL
    preset: lmstudio
    max_concurrency: 1          # A2: single 12 GB GPU; a second request waits
    concurrency_group: local_gpu # one local call at a time on the GPU
    timeout_s: 180
  cloud:
    # Enabled only when OMNIGROWTH_CLOUD_API_KEY is set AND base_url is filled in.
    locality: REMOTE
    base_url: ""
    uses_cloud_key: true
    max_concurrency: 4
    timeout_s: 120

# Ordered candidates per role. The router filters by routing profile and privacy class.
# One main local model keeps LM Studio from swapping models on a 12 GB GPU.
# Decision 2026-09-26 (human): LM Studio is the only local server; writers stay on
# REASONING_LOCAL (same model as planning). The ollama preset remains available via
# OMNIGROWTH_LOCAL_LLM_PRESET but no role routes to it.
roles:
  CHEAP_LOCAL:
    - {provider: lmstudio, model: "qwen/qwen3.5-9b"}
  REASONING_LOCAL:
    - {provider: lmstudio, model: "qwen/qwen3.5-9b"}
  CODING_LOCAL:
    - {provider: lmstudio, model: "qwen/qwen3.5-9b"}
  EMBEDDING_LOCAL:
    - {provider: lmstudio, model: "text-embedding-nomic-embed-text-v1.5"}
  # Frontier roles: local fallbacks first so LOCAL_ONLY still works; add cloud candidates
  # (provider: cloud, with per-million-token costs) when a cloud key is configured.
  FRONTIER_FAST:
    - {provider: lmstudio, model: "qwen/qwen3.5-9b"}
  FRONTIER_REASONING:
    - {provider: lmstudio, model: "qwen/qwen3.5-9b"}
  FRONTIER_CREATIVE:
    - {provider: lmstudio, model: "google/gemma-4-12b-qat"}
    - {provider: lmstudio, model: "qwen/qwen3.5-9b"}
