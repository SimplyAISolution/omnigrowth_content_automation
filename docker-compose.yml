# OmniGrowth local stack (ADR-0007 scope: api, worker, scheduler, postgres, redis).
# Project name is fixed so it never collides with other stacks on this engine (ADR-0008).
# Usage: docker compose up -d --wait        (compose reads .env for ${...} values)
name: omnigrowth

x-app: &app
  build: .
  image: omnigrowth:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    # A1: containers use the preset's base_url_docker (host.docker.internal). Set
    # OMNIGROWTH_DOCKER_LLM_URL in .env only to override the preset for containers.
    OMNIGROWTH_RUNTIME: docker
    OMNIGROWTH_LOCAL_LLM_URL: ${OMNIGROWTH_DOCKER_LLM_URL:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command:
      - uvicorn
      - omnigrowth.api.app:create_app
      - --factory
      - --host
      - "0.0.0.0"  # container-internal; published only on 127.0.0.1 below
      - --port
      - "8000"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5); sys.exit(0 if r.status==200 else 1)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["python", "-m", "omnigrowth.workflows.worker"]
    depends_on: &after_migrate
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy when this container's worker is registered in Redis.
      test:
        - CMD
        - python
        - -c
        - "import os,socket,sys; from redis import Redis; from rq import Worker; c=Redis.from_url(os.environ['REDIS_URL']); sys.exit(0 if any(w.hostname==socket.gethostname() for w in Worker.all(connection=c)) else 1)"
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 10s

  scheduler:
    <<: *app
    command: ["python", "-m", "omnigrowth.scheduling"]
    depends_on: *after_migrate
    healthcheck:
      # The scheduler touches its heartbeat file every tick.
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/tmp/omnigrowth-scheduler.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 30 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

volumes:
  pgdata:
  redisdata:
